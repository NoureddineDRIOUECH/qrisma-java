version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: qrisma
      POSTGRES_PASSWORD: qrisma
      POSTGRES_DB: qrisma
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/qrisma
      SPRING_DATASOURCE_USERNAME: qrisma
      SPRING_DATASOURCE_PASSWORD: qrisma
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: "change-me-in-production"
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_WALLET_ISSUER_ID: "YOUR_ISSUER_ID"
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080
    depends_on:
      - backend

volumes:
  db-data: